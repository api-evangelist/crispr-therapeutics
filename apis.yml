name: CRISPR Therapeutics
description: 'CRISPR Therapeutics (NASDAQ: CRSP) is a clinical-stage biotechnology company
  founded in 2013 and headquartered in Zug, Switzerland, with US operations in Boston,
  Massachusetts. Co-founded by CRISPR/Cas9 pioneer Emmanuelle Charpentier, the company
  develops transformative gene-based medicines for serious human diseases. Its programs
  span hemoglobinopathies, immuno-oncology, regenerative medicine, and in-vivo editing;
  its lead therapy CASGEVY (exagamglogene autotemcel), developed with Vertex Pharmaceuticals,
  is the first approved CRISPR/Cas9 gene-editing treatment for sickle cell disease and
  transfusion-dependent beta thalassemia. This is a corporate/investor web presence with
  no public developer program or API surface.'
